<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    h2 {
      margin: 0 0 4px;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      margin: 0 0 12px;
      font-size: 11px;
      color: #94a3b8;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 11px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #064e3b;
      color: #6ee7b7;
      font-weight: 700;
      font-size: 10px;
      margin-bottom: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .footer {
      margin-top: 10px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <h2><span>⚡</span> CyberSwitch Autofill</h2>
  <p>1-Click candidate form filler for Workday, Greenhouse & Lever.</p>

  <div class="card">
    <div class="badge">Target Candidate: Gourav Parit</div>
    <div><strong>Role:</strong> Cybersecurity Analyst (SOC L2)</div>
    <div><strong>Experience:</strong> 2+ Years (Strict Target)</div>
    <div><strong>Target CTC:</strong> 12 - 15 LPA</div>
    <div><strong>Cert:</strong> Microsoft SC-200</div>
  </div>

  <button id="btn-open-dashboard">Open CyberSwitch Dashboard</button>

  <div class="footer">Connected to http://localhost:8000</div>

  <script src="popup.js"></script>
</body>
</html>
